<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- THE CORE CHAMBER OFFICIAL LOGO EMBLEM -->
  <defs>
    <style>
      .tcc-dark { fill: #131926; }
      .tcc-red { fill: #E52336; }
      .tcc-text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- 1. Outer Hexagonal Bracket -->
  <path class="tcc-dark" fill-rule="evenodd" d="
    M 390 55
    L 130 55
    L 15 250
    L 130 445
    L 390 445
    L 358 413
    L 148 413
    L 52 250
    L 148 87
    L 358 87
    Z
  "/>

  <!-- 2. Inner Hexagonal Bracket -->
  <path class="tcc-dark" fill-rule="evenodd" d="
    M 410 120
    L 165 120
    L 88 250
    L 165 380
    L 410 380
    L 426 348
    L 182 348
    L 125 250
    L 182 152
    L 426 152
    Z
  "/>

  <!-- 3. Right Chevron Bracket -->
  <path class="tcc-dark" fill-rule="evenodd" d="
    M 410 180
    L 480 250
    L 410 320
    L 448 320
    L 480 288
    L 480 212
    L 448 180
    Z
  "/>

  <!-- 4. Center Typography -->
  <!-- Top Line: THE CORE -->
  <g class="tcc-text">
    <!-- "THE" -->
    <text x="175" y="236" font-size="34" letter-spacing="9" class="tcc-dark" font-weight="800">THE</text>
    <!-- "CORE" (Red) -->
    <text x="278" y="236" font-size="34" letter-spacing="9" class="tcc-red" font-weight="900">CORE</text>

    <!-- Bottom Line: CHAMBER -->
    <text x="175" y="286" font-size="32" letter-spacing="12" class="tcc-dark" font-weight="800">CHAMBER</text>
  </g>
</svg>
