<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>THE CORE CHAMBER | FORMS & DATA MEMBER MANAGEMENT</title>
    <meta name="description" content="Web App Formulir Physical Fitness Score Card The Core Chamber untuk evaluasi kebugaran, komposisi tubuh, BMI, functional, strength, dan skill assessment." />
    <!-- Apple iOS / Safari optimization -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TCC Score Card" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/tcc-logo.svg" />
    <meta name="theme-color" content="#020617" />
    <meta property="og:title" content="THE CORE CHAMBER - FORM - PHYSICAL FITNESS SCORE CARD" />
    <meta property="og:description" content="Web App Formulir Physical Fitness Score Card The Core Chamber untuk evaluasi kebugaran, komposisi tubuh, BMI, functional, strength, dan skill assessment." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/tcc-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tcc_scorecard_darkmode');
          if (saved === 'true' || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-white transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
